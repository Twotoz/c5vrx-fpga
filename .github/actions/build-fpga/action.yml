name: Build FPGA bitstream
description: Build a Tang Nano 20K variant with a pinned toolchain and optional exact placement.
inputs:
  variant:
    description: lcd, lcd-dvr, hdmi, hdmi-dvr, hdmi90, lcd-debug or hdmi-debug (the standard builds)
    required: true
  placement:
    description: Exact seed or seed:beta. Empty - the one in fpga/placements.txt first, then the build script's list.
    default: ""
  artifact:
    description: Unique artifact name for this job
    required: true
  pnr-timeout:
    description: Time limit per place-and-route try (timeout syntax, e.g. 6m); empty for none
    default: ""
runs:
  using: composite
  steps:
    - uses: YosysHQ/setup-oss-cad-suite@853bb54f52246aa8fb4fab963f104cfb6676197a # v4
      with:
        version: "2026-11-24"
        github-token: ${{ github.token }}
    - name: Build and stage bitstream
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
        PLACEMENT: ${{ inputs.placement }}
        PNR_TIMEOUT: ${{ inputs.pnr-timeout }}
      run: |
        export NODVR=0 HDMI=0 HDMI90=0 LCDBUF=0 DEBUG=0
        suffix=""
        # the placement that routed last (fpga/placements.txt) first, then the fallback list
        if [ -z "$PLACEMENT" ]; then
          pin=$(awk -v v="$VARIANT" '$1 == v { print $2 }' fpga/placements.txt)
          if [ -n "$pin" ]; then
            list="default 3:0.8 1:0.8 1:0.7 5:0.8 6:0.8 7:0.8 8:0.8 2:0.7 3:0.7 4:0.7"
            TRIES="$pin"
            for t in $list; do [ "$t" = "$pin" ] || TRIES="$TRIES $t"; done
            export TRIES TRIES_HDMI="$TRIES"
            echo "placements: $TRIES"
          fi
        fi
        case "$VARIANT" in *-debug) DEBUG=1; suffix=_debug; VARIANT=${VARIANT%-debug} ;; esac
        # LCD: the buffered LCD (~3 ms), no DVR; LCD-DVR: the LCD line by line with
        # the HQ DVR and the compact 7-segment OSD (hq_ui.v: the full menu does not
        # fit next to the DVR); HDMI: no DVR; HDMI-DVR: as LCD-DVR on HDMI;
        # HDMI90: 90 Hz, field buffer
        case "$VARIANT" in
          lcd) NODVR=1; LCDBUF=1; source=triversity.fs; asset=triversity_lcd.fs ;;
          lcd-dvr) export TRIDVR=1; source=triversity_dvr.fs; asset=triversity_lcd_dvr.fs ;;
          hdmi) HDMI=1; NODVR=1; source=triversity_hdmi.fs ;;
          hdmi-dvr) HDMI=1; export TRIDVR=1; source=triversity_dvr_hdmi.fs; asset=triversity_hdmi_dvr.fs ;;
          hdmi90) HDMI90=1; source=triversity_hdmi90.fs ;;
          *) printf 'Unknown FPGA variant: %s\n' "$VARIANT" >&2; exit 2 ;;
        esac
        asset=${asset:-$source}; asset=${asset%.fs}$suffix.fs
        fpga/build.sh
        mkdir -p "$RUNNER_TEMP/bitstream"
        cp "fpga/build/$source" "$RUNNER_TEMP/bitstream/$asset"
        cp fpga/build/placement.txt "$RUNNER_TEMP/bitstream/$asset.placement.txt"
        cat fpga/build/placement.txt >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/bitstream/
        if-no-files-found: error
        overwrite: true
