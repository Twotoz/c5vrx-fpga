name: FPGA

on:
  push:
    branches: [main]
    paths: ["fpga/**", "tools/**", ".github/workflows/fpga.yml"]
  pull_request:
    paths: ["fpga/**", "tools/**", ".github/workflows/fpga.yml"]
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4          # research/sim.py for the combiner and video models
        with:
          repository: Twotoz/C5VRX
          path: C5VRX
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog fonts-jetbrains-mono
          pip install numpy scipy numba pillow
      - name: Combiner and discriminator, bit-exact with the model
        run: python fpga/sim/run_tb3.py
        env: { C5VRX_RESEARCH: "${{ github.workspace }}/C5VRX/research" }
      - name: B / C alignment (shared engine against two separate ones)
        run: python fpga/sim/run_align_tb.py
      - name: Markers
        run: python fpga/sim/run_marker_tb.py
      - name: Channel link
        run: python fpga/sim/run_link_tx_tb.py
      - name: DVR (fast and slow card)
        run: python fpga/sim/run_dvr_tb.py 12 && python fpga/sim/run_dvr_tb.py 12 400
      - name: Colour decoder, bit-exact (NTSC and PAL)
        run: python fpga/sim/run_chroma_tb.py NTSC && python fpga/sim/run_chroma_tb.py PAL
        env: { C5VRX_RESEARCH: "${{ github.workspace }}/C5VRX/research" }
      - name: Noise filter (adaptive noise suppression), bit-exact
        run: python fpga/sim/run_ans_tb.py
        env: { C5VRX_RESEARCH: "${{ github.workspace }}/C5VRX/research" }
      - name: OSD, pixel for pixel (menu build and HQ DVR build)
        run: python fpga/sim/run_osd_tb.py && python fpga/sim/run_osd_tb.py --hdmi && python fpga/sim/run_osd_tb.py --hq && python fpga/sim/run_osd_tb.py --tridvr
      - name: TMDS encoder (HDMI), against the model
        run: python fpga/sim/run_tmds_tb.py
      - name: JPEG encoder, byte-exact with the model (NTSC, PAL, stalled output)
        run: python fpga/sim/run_jpeg_tb.py 3 && python fpga/sim/run_jpeg_tb.py 0 --pal && python fpga/sim/run_jpeg_tb.py 7 --stall
      - name: HQ DVR to the card, byte-exact
        run: python fpga/sim/run_dvr_hq_tb.py 3
      - name: Aspect signalling (CGMS-A, WSS)
        run: python fpga/sim/run_aspect_tb.py
        env: { C5VRX_RESEARCH: "${{ github.workspace }}/C5VRX/research" }
      - name: Video path end to end
        run: python fpga/sim/run_video_tb.py
        env: { C5VRX_RESEARCH: "${{ github.workspace }}/C5VRX/research" }

  bitstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install apycula yowasp-yosys yowasp-nextpnr-himbaechel-gowin
      - name: Build
        run: fpga/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: triversity-fpga-bitstream
          path: fpga/build/triversity.fs

  bitstream-hdmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install apycula yowasp-yosys yowasp-nextpnr-himbaechel-gowin
      - name: Build (HDMI)
        run: HDMI=1 fpga/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: triversity-fpga-bitstream-hdmi
          path: fpga/build/triversity_hdmi.fs
