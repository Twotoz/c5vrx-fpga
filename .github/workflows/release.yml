name: Release

# Every push to main that changes the C5 firmware or the FPGA design builds both
# and publishes them as release triversity-v<run number> (marked Latest); the
# Pages workflow then mirrors it into the web flasher.
on:
  push:
    branches: [main]
    paths: ["c5/**", "fpga/rtl/**", "fpga/boards/**", "fpga/build.sh", ".github/workflows/release.yml", ".github/actions/**"]
  workflow_dispatch:
    inputs:
      lcd_dvr_placement:
        description: "LCD-DVR: exact placement (seed or seed:beta, e.g. 3:0.8, from a local build's placement.txt); empty tries eight"
        type: string
      hdmi_dvr_placement:
        description: "HDMI-DVR: exact placement; empty tries eight"
        type: string
      hdmi90_placement:
        description: "HDMI 90 Hz: exact placement; empty for the build script's list"
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  c5:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        working-directory: c5
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -DC5VRX5_COMMIT="${GITHUB_SHA}" set-target esp32c5 build
          mkdir -p ../out
          cp build/triversity_c5.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin \
             build/flasher_args.json ../out/
      - uses: actions/upload-artifact@v4
        with: { name: c5, path: out/ }

  # The standard builds (README "Bitstreams"): LCD, LCD-DVR, HDMI, HDMI-DVR,
  # HDMI90, LCD-DEBUG, HDMI-DEBUG. The DVR builds sit at ~85 % LUT, where not
  # every placement routes and one try can take most of an hour: each tries eight
  # placements at once (seed:beta), each on its own runner, and publish takes one
  # that routed. A manual run can pin one exact placement (the one a local build
  # reported in placement.txt); the toolchain is pinned in
  # .github/actions/build-fpga, so the same commit and placement give the same
  # bitstream.
  fpga-lcd-dvr:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        placement: ${{ fromJSON(inputs.lcd_dvr_placement != '' && format('["{0}"]', inputs.lcd_dvr_placement) || '["default", "3:0.8", "1:0.8", "1:0.7", "5:0.8", "6:0.8", "7:0.8", "2:0.7"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-fpga
        with:
          variant: lcd-dvr
          placement: ${{ matrix.placement }}
          artifact: fpga-lcd-dvr-${{ strategy.job-index }}

  fpga-hdmi-dvr:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        placement: ${{ fromJSON(inputs.hdmi_dvr_placement != '' && format('["{0}"]', inputs.hdmi_dvr_placement) || '["3:0.8", "1:0.8", "1:0.7", "5:0.8", "6:0.8", "7:0.8", "8:0.8", "2:0.7"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-fpga
        with:
          variant: hdmi-dvr
          placement: ${{ matrix.placement }}
          artifact: fpga-hdmi-dvr-${{ strategy.job-index }}

  fpga-hdmi90:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-fpga
        with:
          variant: hdmi90
          placement: ${{ inputs.hdmi90_placement }}
          artifact: fpga-hdmi90

  # LCD (buffered), HDMI and the two debug builds: one try each
  fpga:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [lcd, hdmi, lcd-debug, hdmi-debug]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-fpga
        with:
          variant: ${{ matrix.variant }}
          artifact: fpga-${{ matrix.variant }}

  publish:
    needs: [c5, fpga, fpga-lcd-dvr, fpga-hdmi-dvr, fpga-hdmi90]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: all }
      - name: One bitstream of each
        run: |
          mkdir out
          cp all/c5/* out/
          cp all/fpga-hdmi90/triversity_hdmi90.fs* out/
          for v in lcd hdmi lcd-debug hdmi-debug; do cp all/fpga-$v/*.fs* out/; done
          lcd=$(ls all/fpga-lcd-dvr-*/triversity_lcd_dvr.fs 2>/dev/null | head -1)
          hdmi=$(ls all/fpga-hdmi-dvr-*/triversity_hdmi_dvr.fs 2>/dev/null | head -1)
          [ -n "$lcd" ] && [ -n "$hdmi" ] || { echo "no LCD-DVR or no HDMI-DVR placement routed"; exit 1; }
          echo "LCD-DVR from $lcd, HDMI-DVR from $hdmi"
          cp "$lcd" "$lcd.placement.txt" "$hdmi" "$hdmi.placement.txt" out/
          for f in out/*.placement.txt; do echo "== ${f#out/}"; cat "$f"; done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: triversity-v${{ github.run_number }}
        run: |
          cd out
          sha256sum * > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Triversity $TAG" \
            --notes "C5 firmware (all three C5s) and the Tang Nano 20K bitstreams: triversity_lcd.fs (LCD, buffered ~3 ms), triversity_lcd_dvr.fs (LCD with the HQ DVR), triversity_hdmi.fs (HDMI), triversity_hdmi_dvr.fs (HDMI with the HQ DVR), triversity_hdmi90.fs (HDMI at 90 Hz), *_debug.fs (live status on the Tang's USB serial). Built from ${GITHUB_SHA} (seed and toolchain of each in its .placement.txt). Flash with the web flasher." \
            *
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
