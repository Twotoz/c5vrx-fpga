name: Release

# Every push to main that changes the C5 firmware or the FPGA design builds both
# and publishes them as release triversity-v<run number> (marked Latest); the
# Pages workflow then mirrors it into the web flasher.
on:
  push:
    branches: [main]
    paths: ["c5/**", "fpga/rtl/**", "fpga/boards/**", "fpga/build.sh", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  c5:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        working-directory: c5
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -DC5VRX5_COMMIT="${GITHUB_SHA}" set-target esp32c5 build
          mkdir -p ../out
          cp build/triversity_c5.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin \
             build/flasher_args.json ../out/
      - uses: actions/upload-artifact@v4
        with: { name: c5, path: out/ }

  # At ~85 % LUT not every placement routes and one try takes up to an hour:
  # the LCD and HDMI bitstreams try eight placements at once (seed:density),
  # each on its own runner; publish takes one that routed.
  fpga:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        try: ["default", "3:0.8", "1:0.8", "1:0.7", "5:0.8", "6:0.8", "7:0.8", "2:0.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install apycula yowasp-yosys yowasp-nextpnr-himbaechel-gowin
      - run: TRIES="${{ matrix.try }}" fpga/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: "fpga-lcd-${{ strategy.job-index }}", path: fpga/build/triversity.fs }

  fpga-hdmi:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        try: ["3:0.8", "1:0.8", "1:0.7", "5:0.8", "6:0.8", "7:0.8", "8:0.8", "2:0.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install apycula yowasp-yosys yowasp-nextpnr-himbaechel-gowin
      - run: HDMI=1 TRIES_HDMI="${{ matrix.try }}" fpga/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: "fpga-hdmi-${{ strategy.job-index }}", path: fpga/build/triversity_hdmi.fs }

  fpga-hdmi90:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install apycula yowasp-yosys yowasp-nextpnr-himbaechel-gowin
      - run: HDMI90=1 fpga/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: fpga-hdmi90, path: fpga/build/triversity_hdmi90.fs }

  publish:
    needs: [c5, fpga, fpga-hdmi, fpga-hdmi90]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: all }
      - name: One bitstream of each
        run: |
          mkdir out
          cp all/c5/* out/
          cp all/fpga-hdmi90/triversity_hdmi90.fs out/
          lcd=$(ls all/fpga-lcd-*/triversity.fs 2>/dev/null | head -1)
          hdmi=$(ls all/fpga-hdmi-*/triversity_hdmi.fs 2>/dev/null | head -1)
          [ -n "$lcd" ] && [ -n "$hdmi" ] || { echo "no LCD or no HDMI placement routed"; exit 1; }
          echo "LCD from $lcd, HDMI from $hdmi"
          cp "$lcd" "$hdmi" out/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: triversity-v${{ github.run_number }}
        run: |
          cd out
          sha256sum * > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Triversity $TAG" \
            --notes "C5 firmware (all three C5s) and the Tang Nano 20K bitstreams (Triversity, colour, menu and HQ DVR; triversity.fs for the LCD, triversity_hdmi.fs for HDMI; triversity_hdmi90.fs HDMI at 90 Hz without the HQ DVR), built from ${GITHUB_SHA}. Flash with the web flasher." \
            *
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
