name: Release

# Every push to main that changes the C5 firmware or the FPGA design builds both
# and publishes them as release triversity-v<run number> (marked Latest); the
# Pages workflow then mirrors it into the web flasher.
on:
  push:
    branches: [main]
    paths: ["c5/**", "fpga/rtl/**", "fpga/boards/**", "fpga/build.sh", "fpga/placements.txt", ".github/workflows/release.yml", ".github/actions/**"]
  workflow_dispatch:
    inputs:
      include_hdmi90:
        description: Include the 90 Hz HDMI bitstream in this release
        type: boolean
        default: false
      hdmi90_placement:
        description: Exact HDMI90 placement (e.g. 5:0.8), empty for automatic
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  c5:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        working-directory: c5
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -DC5VRX5_COMMIT="${GITHUB_SHA}" set-target esp32c5 build
          mkdir -p ../out
          cp build/triversity_c5.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin \
             build/flasher_args.json ../out/
      - uses: actions/upload-artifact@v4
        with: { name: c5, path: out/ }

  # Publish the six standard variants automatically. HDMI90 is opt-in while
  # it regularly fails to place within the job budget. For each build, try
  # fpga/placements.txt first (the one that routed last), the build script's
  # list after it only if that one no longer routes. The toolchain is pinned
  # in .github/actions/build-fpga: the same commit and placement give the same
  # bitstream.
  fpga:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.include_hdmi90 && '["lcd", "lcd-dvr", "hdmi", "hdmi-dvr", "lcd-debug", "hdmi-debug", "hdmi90"]' || '["lcd", "lcd-dvr", "hdmi", "hdmi-dvr", "lcd-debug", "hdmi-debug"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-fpga
        with:
          variant: ${{ matrix.variant }}
          placement: ${{ matrix.variant == 'hdmi90' && inputs.hdmi90_placement || '' }}
          artifact: fpga-${{ matrix.variant }}

  publish:
    needs: [c5, fpga]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: all }
      - name: One bitstream of each
        run: |
          mkdir out
          cp all/c5/* out/
          for d in all/fpga-*; do cp $d/*.fs* out/; done
          for f in out/*.placement.txt; do echo "== ${f#out/}"; cat "$f"; done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: triversity-v${{ github.run_number }}
        run: |
          cd out
          sha256sum * > SHA256SUMS
          hdmi90_note=""
          if [[ -f triversity_hdmi90.fs ]]; then
            hdmi90_note=" Also includes triversity_hdmi90.fs (HDMI at 90 Hz)."
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Triversity $TAG" \
            --notes "C5 firmware (all three C5s) and the Tang Nano 20K bitstreams: triversity_lcd.fs (LCD, buffered ~3 ms), triversity_lcd_dvr.fs (LCD with the HQ DVR), triversity_hdmi.fs (HDMI), triversity_hdmi_dvr.fs (HDMI with the HQ DVR), *_debug.fs (live status on the Tang's USB serial).${hdmi90_note} Built from ${GITHUB_SHA} (seed and toolchain of each in its .placement.txt). Flash with the web flasher." \
            *
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
